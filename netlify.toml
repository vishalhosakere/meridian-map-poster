[build]
  command = "npm run build"
  publish = "dist"

# Proxy Overpass mirrors through Netlify so the browser makes same-origin requests
# (avoids CORS — the edge fetches upstream server-side). POST body is forwarded.
[[redirects]]
  from = "/osm/de"
  to = "https://overpass-api.de/api/interpreter"
  status = 200
  force = true

[[redirects]]
  from = "/osm/kumi"
  to = "https://overpass.kumi.systems/api/interpreter"
  status = 200
  force = true

[[redirects]]
  from = "/osm/mail"
  to = "https://maps.mail.ru/osm/tools/overpass/api/interpreter"
  status = 200
  force = true

# SPA fallback (must stay last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
