[build]
  command = "npm run build"
  publish = "dist"

# Vite 8 needs Node 20.19+ / 22.12+.
[build.environment]
  NODE_VERSION = "22"

# SPA fallback. force = false (the default) means files that exist in dist, such as
# robots.txt, sitemap.xml and og-image.png, are served as-is and never rewritten.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
